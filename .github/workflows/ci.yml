name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test with Maven (multi-module)
      run: mvn -B clean verify --file petreminder-app/pom.xml
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    - name: Generate JaCoCo Coverage Reports
      run: mvn -B jacoco:report --file petreminder-app/pom.xml

    - name: Upload lib coverage report
      uses: actions/upload-artifact@v3
      with:
        name: lib-test-coverage-report
        path: petreminder-app/lib/target/site/jacoco/
        if-no-files-found: warn

    - name: Upload app coverage report
      uses: actions/upload-artifact@v3
      with:
        name: app-test-coverage-report
        path: petreminder-app/app/target/site/jacoco/
        if-no-files-found: warn

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: |
          petreminder-app/lib/target/site/jacoco/jacoco.xml
          petreminder-app/app/target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-petreminder
        fail_ci_if_error: false
